name: Git koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: koi/koi.gif
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: redraw koi"
          file_pattern: koi/koi.gif
